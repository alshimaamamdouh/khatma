# Runs every test on each push and pull request, so a change that breaks
# the site is caught before it reaches the family. Uses only an in-memory
# database — never the real one.
name: Tests

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      # The end-to-end tests start the API from server/, so it needs its packages too
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run test:unit
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
        working-directory: client
      - name: Keep screenshots and report when end-to-end tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            client/test-results/
            client/playwright-report/
            client/e2e/screenshots/
